[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drl-teamwork"
version = "0.1.0"
description = "Reproducible small-scale cooperative and competitive MARL coursework"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mpe2>=1.0,<2", "pettingzoo>=1.24,<2", "gymnasium>=1.0,<2",
  "numpy>=1.26,<3", "torch==2.7.1", "pyyaml>=6,<7",
  "imageio>=2.35,<3", "pillow>=10,<13", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
extra-envs = ["lbforaging==2.0.0", "rware==2.0.0"]

[project.scripts]
marl = "teamwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
