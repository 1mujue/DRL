# 前馈 MAPPO；环境个体奖励原样保留，actor 仅用自己的局部观测。
env: spread
algorithm: mappo_ff
seed: 0
device: cpu
total_steps: 100000
rollout_steps: 256
batch_size: 64
epochs: 4
actor_lr: 0.0003
critic_lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip: 0.2
value_clip: 0.2
value_loss_coef: 1.0
entropy_coef: 0.01
max_grad_norm: 0.5
adam_eps: 0.00001
huber_delta: 10.0
use_clipped_value_loss: true
use_huber_loss: true
value_normalization: true
feature_normalization: true
share_policy: true
hidden_size: 64
hidden_layers: 2
actor_output_gain: 0.01
linear_lr_decay: false
checkpoint_interval: 10000
