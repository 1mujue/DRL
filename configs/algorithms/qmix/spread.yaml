# 与 mappo/spread.yaml 固定相同环境、预算、折扣和 mean 团队奖励。
algorithm: qmix
env: spread
env_kwargs:
  N: 3
  local_ratio: 0.5
  max_cycles: 50
seed: 0
device: cpu
total_steps: 100000
reward_aggregation: mean
gamma: 0.99
checkpoint_interval: 10000

hidden_size: 64
mixing_size: 32
hypernet_size: 64
use_rnn: true
use_last_action: true
use_agent_id: true
double_q: true
replay_capacity: 256
batch_size: 16
learning_starts_episodes: 16
updates_per_episode: 1
target_update_interval: 200
lr: 0.0005
rmsprop_alpha: 0.99
optimizer_eps: 0.00001
max_grad_norm: 10.0
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_steps: 50000
evaluation_epsilon: 0.05
