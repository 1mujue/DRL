# 两机器人仓储：500 步上限，局部传感，公共评估保留原始交付奖励。
algorithm: mappo_ff
env: rware
env_kwargs:
  id: rware-tiny-2ag-v2
  sensor_range: 1
  max_steps: 500
  reward_type: INDIVIDUAL
seed: 0
device: cpu
total_steps: 100000
reward_aggregation: mean
gamma: 0.99
checkpoint_interval: 10000

share_policy: true
hidden_size: 64
hidden_layers: 2
feature_normalization: true
value_normalization: true
rollout_steps: 500
batch_size: 128
epochs: 4
actor_lr: 0.0003
critic_lr: 0.0003
gae_lambda: 0.95
clip: 0.2
value_clip: 0.2
entropy_coef: 0.02
max_grad_norm: 0.5
