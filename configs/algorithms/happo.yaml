# HAPPO 起点配置：三智能体目标覆盖。
# 与 mappo/spread.yaml 固定相同环境条件、训练预算、折扣与 mean 团队奖励，只差顺序更新相关参数。
algorithm: happo
env: spread
env_kwargs:
  N: 3
  local_ratio: 0.5
  max_cycles: 50
seed: 0
device: cpu
total_steps: 100000
reward_aggregation: mean
gamma: 0.99
checkpoint_interval: 10000

# 异构 actor 是 HAPPO 的前提：关闭参数共享，每个 agent 一套独立 actor。
share_policy: false
# 固定更新顺序；留空表示按环境 agent 顺序。改顺序必须整体覆盖全部 agent。
actor_order:
hidden_size: 64
hidden_layers: 2
feature_normalization: true
value_normalization: true
rollout_steps: 256
batch_size: 64
epochs: 4
actor_lr: 0.0003
critic_lr: 0.0003
gae_lambda: 0.95
clip: 0.2
value_clip: 0.2
entropy_coef: 0.01
max_grad_norm: 0.5
