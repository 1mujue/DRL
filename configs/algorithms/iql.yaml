# DQN-based Independent Q-Learning；每个 agent 独立参数与个体奖励。
env: spread
algorithm: iql
seed: 0
device: cpu
total_steps: 100000
hidden_size: 64
lr: 0.0005
gamma: 0.99
buffer_size: 50000
batch_size: 64
learning_starts: 1000
train_interval: 4
target_update_interval: 200
max_grad_norm: 10.0
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 50000
eval_epsilon: 0.05
