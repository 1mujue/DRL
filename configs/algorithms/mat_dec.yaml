# 项目内 MAT-Dec 适配：局部 MLP actor + 训练时的 Transformer critic。
# 结构与官方 dec_actor=True 分支一致；细节差异见 docs/algorithms/MAT_DEC.md。
env: spread
algorithm: mat_dec
seed: 0
device: cpu
total_steps: 100000
team_reward: mean
embedding_dim: 64
num_heads: 1
num_blocks: 1
share_actor: false
rollout_steps: 256
batch_size: 64
epochs: 4
lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip: 0.2
value_clip: true
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
