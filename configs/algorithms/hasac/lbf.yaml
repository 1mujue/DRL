# 全场视野合作采集；与 qmix/lbf.yaml 使用相同场景、预算和团队奖励。
algorithm: hasac_discrete
env: lbf
env_kwargs:
  id: Foraging-8x8-2p-1f-coop-v3
  sight: 8
  max_episode_steps: 50
seed: 0
device: cpu
total_steps: 100000
reward_aggregation: mean
gamma: 0.99
checkpoint_interval: 10000

policy_family: categorical
actor_order:
hidden_size: 64
hidden_layers: 2
feature_normalization: true
actor_output_gain: 0.01
actor_lr: 0.0003
critic_lr: 0.0003
alpha_lr: 0.0003
alpha_start: 0.2
learn_alpha: true
target_entropy_scale: 0.98
tau: 0.005
max_grad_norm: 10.0

replay_capacity: 256
batch_size: 16
learning_starts_episodes: 16
updates_per_episode: 1
