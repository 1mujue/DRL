# Common benchmark for three-agent Spread with team-mean training rewards.
env_kwargs:
  N: 3
  local_ratio: 0.5
  max_cycles: 50
total_steps: 500000
training_seeds: [0, 1, 2]
evaluation:
  seed: 50000
  episodes: 100
metrics:
  - final_coverage
  - final_mean_landmark_distance
  - success
algorithms:
  qtran: ../algorithms/qtran.yaml
  qplex: ../algorithms/qplex.yaml
  qmix: ../algorithms/qmix.yaml
  mappo_ff: ../algorithms/mappo/spread.yaml
